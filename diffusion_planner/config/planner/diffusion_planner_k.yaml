diffusion_planner_k:
  _target_: diffusion_planner.scorer.planner.MultiSampleDiffusionPlanner
  _convert_: "all"

  config:
    _target_: diffusion_planner.utils.config.Config
    _convert_: "all"

    args_file: ???

    guidance_fn: null
  ckpt_path: ???

  past_trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: "all"

    num_poses: 20
    time_horizon: 2

  future_trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: "all"

    num_poses: 80
    time_horizon: 8

  # Best-of-K sampling
  selector:
    _target_: diffusion_planner.scorer.selectors.FirstSample
    _convert_: "all"
  K: 16
  noise_scale: 0.5   # std of the initial diffusion noise (upstream: 0.5)
  steps: 10          # DPM-Solver steps (upstream: 10)
  seed: 0            # torch seed, reset per scenario; null to leave unseeded

  device: cuda
